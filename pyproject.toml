[project]
name = "cairn"
version = "0.1.0"
description = "Reusable FastAPI framework for agentic Python applications with LangGraph"
authors = [{name = "SonderMind Engineering"}]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
cairn = "scripts.cli:main"

[tool.poetry]
packages = [
    {include = "src"},
    {include = "config"},
    {include = "db"},
    {include = "memory"},
    {include = "cache"},
    {include = "assets"},
    {include = "lib"},
    {include = "scripts"},
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = {version = "^0.140.1", extras = ["standard"]}
uvicorn = "^0.51.0"
pydantic = "^2.0"
pydantic-settings = "^2.14.2"
python-dotenv = "^1.0.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.31.0"
alembic = "^1.18.5"
psycopg2-binary = "^2.9"
httpx = "^0.28.0"
pyyaml = "^6.0.1"
structlog = "^26.1"
apscheduler = "^3.11.3"
websockets = "^15.0.0"
langgraph = "^1.2.4"
nest-asyncio = "^1.6.0"
langchain-core = "^1.5.1"
langchain-openai = "^1.4.1"
langchain-anthropic = "^1.5.2"
pyjwt = "^2.8"
langchain = "^1.3.9"
numpy = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
ruff = "^0.16.0"
respx = "^0.23.1"
pre-commit = "^4.6.1"
pip-audit = "^2.10.1"

[tool.poetry.group.aws]
optional = true

[tool.poetry.group.aws.dependencies]
boto3 = "^1.43.56"

[tool.poetry.group.redis]
optional = true

[tool.poetry.group.redis.dependencies]
redis = "^8.0.1"

[tool.poetry.group.pinecone]
optional = true

[tool.poetry.group.pinecone.dependencies]
pinecone = ">=7.0.0"

[tool.poetry.group.pgvector]
optional = true

[tool.poetry.group.pgvector.dependencies]
pgvector = "^0.5.0"

[tool.poetry.group.documentdb]
optional = true

[tool.poetry.group.documentdb.dependencies]
pymongo = "^4.15.0"

[tool.poetry.group.graph-postgres]
optional = true

[tool.poetry.group.graph-postgres.dependencies]
langgraph-checkpoint-postgres = "^3.1.0"

[tool.poetry.group.embeddings]
optional = true

[tool.poetry.group.embeddings.dependencies]
sentence-transformers = ">=5.6.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
    ".claude",
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.coverage.run]
source = ["src", "lib", "db", "memory", "cache", "assets"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers -v"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may need DB or network)",
    "e2e: End-to-end tests (full stack, may need API keys)",
    "eval: Evaluation tests (LLM-as-judge, skip by default)",
]
