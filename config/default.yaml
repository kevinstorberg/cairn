llm:
  provider: anthropic
  model: claude-sonnet-4-6
  max_tokens: 4096

database:
  backend: postgresql
  pool_size: 5

memory:
  backend: in_memory
  embedding_model: all-MiniLM-L6-v2
  embedding_dimension: 384

cache:
  backend: memory
  default_ttl: 300

storage:
  backend: local
  local_path: ./storage

security:
  cors_origins:
    - "*"
